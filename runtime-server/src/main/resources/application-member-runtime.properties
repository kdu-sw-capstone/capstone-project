member.origin=${MEMBER_ORIGIN}
member.link-key=${MEMBER_LINK_KEY}
member.callbacks=${MEMBER_CALLBACKS}
server.port=${MEMBER_PORT:8443}
server.address=127.0.0.1
server.ssl.enabled=true
server.ssl.key-store=${MEMBER_KEYSTORE}
server.ssl.key-store-password=${MEMBER_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${MEMBER_KEY_ALIAS}
server.error.include-message=never
server.tomcat.max-http-form-post-size=1048576

# Schema changes require a separate approved migration step.
spring.flyway.enabled=false
member.fixture.enabled=false
member.mail.test-sink=false
