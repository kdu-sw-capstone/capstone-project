name: FOCURVE CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, codex/server-event12-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focurve-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.8
        env:
          # Disposable runner-only credentials, never a development/user DB.
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: focurve_ci_test
          MYSQL_USER: focurve_ci
          MYSQL_PASSWORD: ci-test-only
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/focurve_ci_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/focurve_ci_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: focurve_ci
      DB_PASSWORD: ci-test-only
      SERVER_PORT: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node for Extension adapter HTTP regression
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install Extension test dependencies
        run: npm --prefix extension ci
      - name: Verify tests and package
        run: bash backend/mvnw -f backend/pom.xml -B -ntp verify
      - name: Record test counts
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          paths = glob.glob('backend/target/surefire-reports/TEST-*.xml')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Backend test reports\n')
              if not paths:
                  out.write('No test reports produced; see failed step logs.\n')
              for path in sorted(paths):
                  r = ET.parse(path).getroot()
                  out.write(f"- {r.get('name')}: tests={r.get('tests')}, failures={r.get('failures')}, errors={r.get('errors')}, skipped={r.get('skipped')}\n")
          PY

  extension:
    name: Extension syntax and mock regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm --prefix extension ci
      - run: npm --prefix extension run check
      - run: npm --prefix extension test
      - run: npm --prefix extension run build:harness

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node from project version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run all frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
