name: Additional Core DNR modules
on:
  pull_request:
    branches: [integration/additional-mvp-20261029]
    paths:
      - 'extension/src/additional-dnr-*.js'
      - 'extension/tests/additional-dnr-*.test.mjs'
      - 'extension/tests/additional-dnr-legacy-writer-browser.mjs'
      - 'extension/a1/contract.mjs'
      - 'extension/a1/core.mjs'
      - 'extension/background/a1-core.bundle.js'
      - 'extension/scripts/build-a1.mjs'
      - 'extension/member-a1/**'
      - 'extension/background/member-a1-core.bundle.js'
      - 'extension/background/member-auth.js'
      - 'extension/tests/member-auth*.test.mjs'
      - 'extension/tests/member-reauthentication.test.cjs'
      - 'extension/background/additional-dnr-writer.bundle.js'
      - 'extension/background/service-worker.js'
      - 'extension/integration/member-a1-bootstrap.js'
      - 'extension/scripts/build-dnr-writer.mjs'
      - 'extension/package*.json'
      - 'contracts/additional-mvp/**'
      - '.github/workflows/additional-core-dnr.yml'
permissions:
  contents: read
jobs:
  dnr-modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: extension
      - run: node --test extension/tests/additional-dnr-inventory.test.mjs extension/tests/additional-dnr-coordinator.test.mjs extension/tests/additional-dnr-site-time-evidence.test.mjs extension/tests/additional-dnr-legacy-writer.test.mjs extension/tests/additional-dnr-guest-writer.test.mjs
      - run: node --test extension/tests/member-auth.test.mjs extension/tests/member-auth-runtime.test.mjs extension/tests/member-reauthentication.test.cjs
      - run: node --test contracts/additional-mvp/rc1/tests/legacy-boundary.test.mjs
      - run: npm run check
        working-directory: extension
