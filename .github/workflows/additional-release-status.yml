name: Additional MVP deleted policy release status
on:
  pull_request:
    branches: [integration/additional-mvp-20261029]
    paths: ['runtime-server/**', 'frontend/**', '.github/workflows/additional-release-status.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: additional-release-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --maxWorkers=2
      - run: npm --prefix frontend run build
  mysql-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci-bridge-root-only
          MYSQL_DATABASE: amvp_test_20261029
          MYSQL_USER: amvp_ci
          MYSQL_PASSWORD: ci-bridge-only
          TZ: UTC
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-bridge-root-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # This suite alone initializes its fresh DB; never enable it beside PR25's DB initializer.
      FOCURVE_AMVP_RECEIPT_TESTS: '1'
      FOCURVE_AMVP_RELEASE_TESTS: '1'
      FOCURVE_AMVP_TEST_URL: jdbc:mysql://127.0.0.1:3306/amvp_test_20261029?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
      FOCURVE_AMVP_TEST_USER: amvp_ci
      FOCURVE_AMVP_TEST_PASSWORD: ci-bridge-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: runtime-server/pom.xml
      - run: bash backend/mvnw -f runtime-server/pom.xml -B -ntp '-Dtest=AmvpReleaseMysqlTest' verify
      - run: bash backend/mvnw -f runtime-server/pom.xml -B -ntp '-Dtest=*,!AdditionalConfigMysqlTest,!AmvpRuntimeBridgeMysqlTest,!AmvpRuntimeReceiptMysqlTest,!AmvpDailyUsageMysqlTest,!AmvpScheduleMysqlTest,!AmvpCadenceMysqlTest,!AmvpReleaseMysqlTest' verify
