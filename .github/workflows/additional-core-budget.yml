name: Additional Core conservative budget arithmetic
on:
  pull_request:
    branches: [integration/additional-mvp-20261029]
    paths:
      - 'extension/src/additional-conservative-budget.js'
      - 'extension/tests/additional-conservative-budget*'
      - 'contracts/additional-mvp/rc1/schema.json'
      - '.github/workflows/additional-core-budget.yml'
permissions:
  contents: read
jobs:
  conservative-budget:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
      - run: node --test extension/tests/additional-conservative-budget.test.mjs
      - run: node --test contracts/additional-mvp/rc1/tests/legacy-boundary.test.mjs
      - run: npm run check
        working-directory: extension
